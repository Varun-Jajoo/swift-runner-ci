name: Build iOS Branch

on:
  push:
    branches:
      - group-classes-ios
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS on macOS Cloud Runner
    runs-on: macos-14

    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MyPT.xcodeproj \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build iOS App Binary
        run: |
          set -o pipefail
          xcodebuild -project MyPT.xcodeproj \
            -scheme MyPT \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -derivedDataPath ./build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Dump Compiler Errors on Failure
        if: failure()
        run: |
          echo "=== XCODEBUILD COMPILER ERRORS ==="
          grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log || cat xcodebuild.log | tail -n 150

      - name: Upload Built App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPT-iOS-App
          path: ./build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
